name: সমস্যা জানান (Bug)
description: Screen Box (আগের নাম My TV) বা TV Tool-এ কিছু ঠিকমতো কাজ করছে না
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: কোন অ্যাপে?
      options: [Screen Box (Mac), Screen Box (Windows), Lite Home, TV Tool ফোন অ্যাপ]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: সংস্করণ
      description: Screen Box-এ সাইডবারের ⓘ বোতামে দেখা যায়
      placeholder: "1.0.0"
  - type: textarea
    id: what
    attributes:
      label: কী হয়েছে?
      description: কী করছিলেন, কী হওয়ার কথা ছিল, কী হলো। স্ক্রিনশট দিলে আরও ভালো।
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: কম্পিউটার
      placeholder: "MacBook Air M2, macOS 15"
